<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#0F231C; --card:#1B3B2E; --line:#2C4A3B;
    --ink:#EFE9DC; --muted:#A9C2B3;
    --rail:#C9D6C2; --rail-dim:#46604f; --dash:#C7CBBE;
    --accent:#6FA98C; --done:#7FC99A; --due:#E8B94E; --over:#E8845C;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background:
      radial-gradient(1000px 520px at 88% -14%, rgba(111,169,140,0.14), transparent 60%),
      linear-gradient(180deg, #0c1d17 0%, #0F231C 100%);
    font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 0; padding: 76px 84px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 22px; }
  .mark { width: 74px; height: 74px; }
  .wordmark { font-size: 60px; font-weight: 800; letter-spacing: -0.035em; }

  .headline { max-width: 720px; }
  .headline h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .headline .hl { color: var(--done); }
  .headline p { margin-top: 22px; font-size: 27px; font-weight: 500; color: var(--muted); line-height: 1.35; max-width: 30ch; }

  .chips { display: flex; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(10,26,20,0.5);
    font-size: 21px; font-weight: 700; color: var(--muted); }
  .chip .g { font-weight: 900; }
  .chip--done { color: var(--done); } .chip--due { color: var(--due); } .chip--over { color: var(--over); }

  /* the birch-trunk timeline spine down the right */
  .spine { position: absolute; right: 150px; top: 0; bottom: 0; width: 118px; }
  .trunk { position: absolute; left: 56px; top: 40px; bottom: 40px; width: 8px; border-radius: 4px;
    background: linear-gradient(180deg, var(--rail), var(--rail-dim)); }
  .lent { position: absolute; height: 12px; border-radius: 6px; }
  .lent--gray { background: var(--dash); box-shadow: 0 0 0 5px #0F231C; }
  .lent--done { background: var(--done); box-shadow: 0 0 0 5px #0F231C; }
</style>
</head>
<body>
  <div class="spine" aria-hidden="true">
    <div class="trunk"></div>
    <div class="lent lent--done" style="left:6px;  top:96px;  width:52px;"></div>
    <div class="lent lent--gray" style="left:60px; top:172px; width:52px;"></div>
    <div class="lent lent--done" style="left:6px;  top:250px; width:52px;"></div>
    <div class="lent lent--gray" style="left:60px; top:330px; width:52px;"></div>
    <div class="lent lent--gray" style="left:6px;  top:408px; width:52px;"></div>
    <div class="lent lent--gray" style="left:60px; top:486px; width:52px;"></div>
  </div>

  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1B3B2E"/>
        <rect x="14.6" y="4" width="2.8" height="24" rx="1.4" fill="#C9D6C2"/>
        <rect x="9" y="9" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="16.5" y="14.5" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="9" y="20" width="6.5" height="2.2" rx="1.1" fill="#C7CBBE"/>
        <rect x="16.5" y="24.2" width="7.4" height="3" rx="1.5" fill="#7FC99A"/>
      </svg>
      <span class="wordmark">vaxdue</span>
    </div>

    <div class="headline">
      <h1>Baby vaccination chart, <span class="hl">dated from date of birth.</span></h1>
      <p>Every dose as a real calendar date &mdash; IAP &amp; NIS, tickable, printable, private.</p>
    </div>

    <div class="chips">
      <span class="chip chip--done"><span class="g">✓</span>done</span>
      <span class="chip chip--due"><span class="g">●</span>due</span>
      <span class="chip chip--over"><span class="g">⚠</span>overdue</span>
      <span class="chip">offline</span>
    </div>
  </div>
</body>
</html>
